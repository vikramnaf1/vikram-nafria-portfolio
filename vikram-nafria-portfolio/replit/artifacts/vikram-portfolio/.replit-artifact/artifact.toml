kind = "web"
previewPath = "/"
title = "Vikram Nafria Portfolio"
description = "A thoughtful portfolio for Vikram Nafria, a healthcare data and analytics professional with 15+ years of experience turning complex payer data into trusted, actionable systems and decisions."
version = "1.0.0"
id = "artifacts/vikram-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25592

[services.development]
run = "pnpm --filter @workspace/vikram-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vikram-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/vikram-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25592"
BASE_PATH = "/"
