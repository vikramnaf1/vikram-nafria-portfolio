<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vikram Nafria Portfolio - Stitch</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    main {
      width: min(90%, 520px);
      text-align: center;
      padding: 32px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    p {
      margin: 0 0 24px;
      color: #555;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    a {
      display: block;
      padding: 14px 18px;
      border-radius: 6px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      background: #333;
    }
  </style>
</head>
<body>
  <main>
    <h1>Vikram Nafria Portfolio</h1>
    <p>Choose the Stitch portfolio version to view.</p>

    <div class="links">
      <a href="./portfolio-desktop.html">View Desktop Version</a>
      <a href="./portfolio-mobile.html">View Mobile Version</a>
    </div>
  </main>
</body>
</html>
